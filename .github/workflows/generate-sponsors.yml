name: Generate Sponsors
on:
  workflow_dispatch:
  schedule:
    - cron: 30 15 * * 0-6

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Validate sponsors token
        id: sponsors-token
        shell: bash
        run: |
          if [ -z "${{ secrets.PAT }}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipping sponsor generation::Repository secret PAT is not configured. Add a token with user:read and read:org scopes to enable this workflow."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Sponsors 💖 in README.md
        if: steps.sponsors-token.outputs.available == 'true'
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PAT }}
          file: 'README.md'
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png" width="50px" style="border-radius: 50px;" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'

      - name: Generate Sponsors 💖 in FUNDING.md
        if: steps.sponsors-token.outputs.available == 'true'
        uses: JamesIves/github-sponsors-readme-action@v1
        with:
          token: ${{ secrets.PAT }}
          file: 'FUNDING.md'
          template: '<a href="https://github.com/{{{ login }}}"><img src="https://github.com/{{{ login }}}.png" width="50px" style="border-radius: 50px;" alt="{{{ login }}}" /></a>&nbsp;&nbsp;'

      - name: Deploy to GitHub Pages 🚀
        if: steps.sponsors-token.outputs.available == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: '.'
